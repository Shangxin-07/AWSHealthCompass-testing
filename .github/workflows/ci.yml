name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests + CDK synth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # CDK's jsii runtime needs Node to synthesize.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt boto3 pytest

      - name: Unit tests
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m pytest tests/unit -q

      # Synth validates every stack (incl. optional ones) without deploying.
      # The dashboard asset only has to exist for synth, so stub it here;
      # the real build is verified in the dashboard job.
      - name: CDK synth (all stacks)
        env:
          CDK_OUTDIR: ${{ runner.temp }}/cdk.out
          CDK_CONTEXT_JSON: >-
            {"account":"123456789012","ops_alert_email":"ci@example.com",
            "deploy_servicenow":"true","deploy_test_tools":"true"}
        run: |
          mkdir -p dashboard/dist && echo ci > dashboard/dist/index.html
          python app.py > /dev/null

  dashboard:
    name: Dashboard typecheck, build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck + build
        run: npm run build

      - name: Tests
        run: npm test
